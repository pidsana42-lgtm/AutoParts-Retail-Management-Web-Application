# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all HTTP traffic to HTTPS (port 80 -> port 443)
server {
    listen 80 default_server;
    server_name jjautopart-pakchong.com www.jjautopart-pakchong.com api.jjautopart-pakchong.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - API Subdomain (api.jjautopart-pakchong.com)
server {
    listen 443 ssl;
    server_name api.jjautopart-pakchong.com;

    ssl_certificate /etc/letsencrypt/live/jjautopart-pakchong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjautopart-pakchong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}

# HTTPS - Main Frontend (jjautopart-pakchong.com / www)
server {
    listen 443 ssl default_server;
    server_name jjautopart-pakchong.com www.jjautopart-pakchong.com;

    ssl_certificate /etc/letsencrypt/live/jjautopart-pakchong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjautopart-pakchong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Go Backend API proxy
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Static assets
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }

    location /barcode/ {
        proxy_pass http://backend:8080/barcode/;
    }

    location /qrcode/ {
        proxy_pass http://backend:8080/qrcode/;
    }

    # WebSocket connection
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
