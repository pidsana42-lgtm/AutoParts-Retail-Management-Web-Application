# WebSocket connection upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Cache only successful, content-hashed build assets. HTML, API responses,
# uploaded documents and errors must not be retained by shared/browser caches.
# Keeping add_header at server level preserves all security headers in locations.
map "$status:$uri" $frontend_cache_control {
    default "no-cache, no-store, must-revalidate";
    "~^(200|206|304):/(assets|fonts)/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|woff2)$" "public, max-age=31536000, immutable";
}

# Redirect all HTTP traffic to HTTPS (port 80 -> port 443)
server {
    listen 80 default_server;
    server_name jjautopart-pakchong.com www.jjautopart-pakchong.com api.jjautopart-pakchong.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - API Subdomain (api.jjautopart-pakchong.com)
server {
    listen 443 ssl;
    server_name api.jjautopart-pakchong.com;

    ssl_certificate /etc/letsencrypt/live/jjautopart-pakchong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjautopart-pakchong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}

# HTTPS - Main Frontend (jjautopart-pakchong.com / www)
server {
    listen 443 ssl default_server;
    server_name jjautopart-pakchong.com www.jjautopart-pakchong.com;

    ssl_certificate /etc/letsencrypt/live/jjautopart-pakchong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jjautopart-pakchong.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The hash permits only the existing QR/barcode print onload handler.
    # unsafe-eval is required by the existing heic2any worker (new Function).
    # Google font endpoints remain for Maps and the existing stock print window.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-hashes' 'sha256-J3nlF6EE2ba/eonWbGGU820R887iSi5IElN4af4iX2E=' https://maps.googleapis.com https://maps.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.jjautopart-pakchong.com wss://jjautopart-pakchong.com wss://www.jjautopart-pakchong.com wss://api.jjautopart-pakchong.com https://*.googleapis.com https://*.gstatic.com https://*.google.com data: blob:; worker-src 'self' blob:; frame-src 'self' blob: https://www.google.com https://maps.google.com; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $frontend_cache_control always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend SPA
    root /usr/share/nginx/html;

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Go Backend API proxy
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Static assets
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }

    location /barcode/ {
        proxy_pass http://backend:8080/barcode/;
    }

    location /qrcode/ {
        proxy_pass http://backend:8080/qrcode/;
    }

    # WebSocket connection
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
