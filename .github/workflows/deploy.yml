name: Deploy Next.js App

on:
  push:
    branches:
      - test-deploy-noto # 📍 1. ทำงานเมื่อ Push เข้า Branch นี้

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Alibaba Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/AutoParts-Retail-Management-Web-Application
            
            # ตรวจสอบและดึงโค้ด
            if [ ! -d ".git" ]; then
              git clone -b test-deploy-noto git@github.com:pidsana42-lgtm/AutoParts-Retail-Management-Web-Application.git .
            else
              # 📍 2. อัปเดตรายชื่อ Branch จาก GitHub และสลับมาใช้ Branch นี้
              git fetch origin
              git checkout test-deploy-noto
              git pull origin test-deploy-noto
            fi

            # เข้าไปที่โฟลเดอร์ frontend เพื่อ Build โปรเจกต์
            cd frontend
            npm install
            npm run build
            
            # สั่งรันด้วย PM2
            pm2 restart frontend-app || pm2 start npm --name "frontend-app" -- start