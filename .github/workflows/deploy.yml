name: Deploy Next.js App

on:
  push:
    branches:
      - import # 📍 ทำงานเมื่อมีการ Push เข้า Branch: import

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Alibaba Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/AutoParts-Retail-Management-Web-Application
            
            # ตรวจสอบและดึงโค้ดจาก Branch import
            if [ ! -d ".git" ]; then
              git clone -b import git@github.com:pidsana42-lgtm/AutoParts-Retail-Management-Web-Application.git .
            else
              git checkout import
              git pull origin import
            fi

            # เข้าไปที่โฟลเดอร์ frontend เพื่อ Build โปรเจกต์
            cd frontend
            npm install
            npm run build
            
            # สั่งรันด้วย PM2
            pm2 restart frontend-app || pm2 start npm --name "frontend-app" -- start