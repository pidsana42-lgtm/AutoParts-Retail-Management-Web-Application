# Initial HTTP reverse proxy for Grafana.
# After installing this file and confirming DNS, run:
# certbot --nginx -d monitor.jjautopart-pakchong.com --redirect
# Certbot will add the TLS certificate and HTTP-to-HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name monitor.jjautopart-pakchong.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
