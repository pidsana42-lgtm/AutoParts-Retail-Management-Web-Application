global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # The backend runs on the host in the current project setup. Docker Desktop
  # resolves this name automatically; extra_hosts in Compose covers Linux.
  - job_name: autoparts-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

