global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # The application runs on a separate server. Nginx on that server exposes
  # only this exact HTTPS endpoint and protects it with HTTP Basic Auth.
  - job_name: autoparts-backend
    scheme: https
    metrics_path: /metrics
    basic_auth:
      username: prometheus
      password_file: /run/secrets/prometheus_metrics_password
    static_configs:
      - targets:
          - jjautopart-pakchong.com

