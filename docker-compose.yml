services:
  postgres:
    image: postgres:15-alpine
    container_name: autoparts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-Autopartsdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Autopartsdb"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  ai-service:
    build:
      context: ./backend/model
      dockerfile: Dockerfile
    container_name: autoparts-ai-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_NAME: ${DB_NAME:-Autopartsdb}
      USE_TFIDF_ONLY: 1
      OCR_PORT: 8000
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autoparts-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      DB_NAME: ${DB_NAME:-Autopartsdb}
      OCR_SERVICE_URL: http://ai-service:8000
      PORT: 8080
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      - backend_barcode:/app/barcode
      - backend_qrcode:/app/QRCode
    ports:
      - "8080:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autoparts-frontend
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  backend_barcode:
  backend_qrcode:
